<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support - COC Calculator</title>

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png" />
  <meta name="theme-color" content="#0f1117" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="css/output.css" />

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/e1acb8aa00.js" crossorigin="anonymous"></script>

  <style>
    .glass-panel {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>

<body class="bg-app text-slate-200 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-surface border border-border rounded-2xl shadow-2xl p-8 relative overflow-hidden glass-panel">
    
    <!-- Decorative background glow -->
    <div class="absolute -top-20 -right-20 w-48 h-48 bg-accent opacity-10 rounded-full blur-[60px] pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-48 h-48 bg-accent opacity-10 rounded-full blur-[60px] pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10">
      <div class="w-16 h-16 bg-app rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner border border-border">
        <i class="fa-solid fa-heart text-accent text-2xl drop-shadow-md"></i>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight mb-2">Support This Project</h2>
      <p class="text-sm text-muted leading-relaxed">
        If this calculator has helped you plan your War attacks and secure those 3-stars, consider supporting me! Your support helps keep this project ad-free and up to date.
      </p>
    </div>

    <div class="space-y-4 relative z-10">
      <!-- DANA / GoPay -->
      <div class="bg-app rounded-xl p-4 border border-border flex items-center justify-between group transition hover:border-accent/50 shadow-sm">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-surface rounded-lg flex items-center justify-center text-2xl shadow-inner text-blue-400">
            <i class="fa-solid fa-wallet"></i>
          </div>
          <div>
            <p class="text-xs text-muted mb-0.5">DANA / GoPay</p>
            <p class="text-base font-semibold text-slate-100 font-mono tracking-wider" id="gopay-number">083847630740</p>
          </div>
        </div>
        <button onclick="copyNumber()" class="text-xs bg-surface hover:bg-accent hover:text-white text-accent border border-accent/30 px-4 py-2 rounded-lg transition-all active:scale-95 flex items-center gap-2">
          <i class="fa-regular fa-copy"></i>
          <span id="copy-text">Copy</span>
        </button>
      </div>

      <!-- PayPal -->
      <div class="bg-app rounded-xl p-4 border border-border flex items-center justify-between group transition hover:border-blue-500/50 shadow-sm">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-surface rounded-lg flex items-center justify-center text-2xl shadow-inner text-blue-500">
            <i class="fa-brands fa-paypal"></i>
          </div>
          <div>
            <p class="text-xs text-muted mb-0.5">PayPal</p>
            <p class="text-base font-semibold text-slate-100 tracking-wide">@yusufalvian16</p>
          </div>
        </div>
        <a href="https://paypal.me/yusufalvian16" target="_blank" rel="noopener noreferrer" class="text-xs bg-surface hover:bg-blue-600 hover:border-blue-500 hover:text-white text-blue-400 border border-blue-500/30 px-4 py-2 rounded-lg transition-all active:scale-95 flex items-center gap-2">
          <span>Donate</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
        </a>
      </div>
    </div>

    <div class="text-center relative z-10 mt-8">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm text-muted hover:text-white transition-colors py-2 px-4 rounded-full hover:bg-surface">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        Back to Calculator
      </a>
    </div>
  </div>

  <script>
    function copyNumber() {
      navigator.clipboard.writeText('083847630740');
      const copyText = document.getElementById('copy-text');
      const originalText = copyText.innerText;
      copyText.innerText = 'Copied!';
      setTimeout(() => {
        copyText.innerText = originalText;
      }, 2000);
    }
  </script>
</body>
</html>
